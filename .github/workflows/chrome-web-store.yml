name: Chrome Web Store Submit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to submit, for example v0.1.1
        required: true
      dry_run:
        description: Validate the release package and print the submission plan without uploading
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  # Deliberately a separate, environment-free job. GitHub evaluates `environment:` at the
  # job level, before any step runs, so a guard living inside the protected job cannot
  # report anything until a maintainer has already approved the deployment -- the refusal
  # would arrive after the human cost it exists to avoid, and an unapproved run would sit
  # waiting having never stated its reason. Keeping this ungated means a disabled upload
  # fails immediately, loudly, and without consuming an approval.
  #
  # It must never carry `environment:`; `ci-workflow.test.ts` asserts that.
  enablement:
    name: Check upload enablement
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A real upload requires the explicit repository variable, which is the invariant
      # `release.yml` carried before store submission was decoupled from the release
      # pipeline. A failing step rather than a job-level `if:`: a skipped job reports
      # success, so a dry_run=false dispatch with the variable unset would show a green
      # run and no upload, readable as a completed submission. Guards fail closed and
      # name their own reason.
      - name: Require explicit enablement for a real upload
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CWS_SUBMIT_ENABLED: ${{ vars.CWS_SUBMIT_ENABLED }}
        run: |
          if [ "$CWS_SUBMIT_ENABLED" != "true" ]; then
            echo "::error title=Chrome Web Store upload refused::dry_run=false was requested but the repository or organization variable CWS_SUBMIT_ENABLED is not exactly 'true'. Nothing was uploaded, and no deployment approval was requested. Re-run with dry_run=true to validate the package without uploading, or set the variable deliberately before retrying."
            exit 1
          fi
          echo "CWS_SUBMIT_ENABLED is set; proceeding to request deployment approval."

  submit:
    name: Submit release package
    needs: enablement
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: chrome-web-store

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Download verified release package
        run: >-
          gh release download "${{ inputs.tag }}"
          --pattern "*chrome.zip"
          --pattern "*.sha256"
          --pattern "pack-release-provenance.v1.json"
          --dir .release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify downloaded release package
        run: >-
          node scripts/verify-github-release-assets.mjs
          --tag "${{ inputs.tag }}"
          --zip .release/*chrome.zip
          --checksum .release/*.sha256
          --provenance .release/pack-release-provenance.v1.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Submit to Chrome Web Store
        run: >-
          node scripts/publish-chrome-web-store.mjs
          --zip .release/*chrome.zip
          --provenance .release/pack-release-provenance.v1.json
          --dry-run "${{ inputs.dry_run }}"
        env:
          CWS_EXTENSION_ID: nfnbhekccajjfgkppolomflaeledoccb
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
