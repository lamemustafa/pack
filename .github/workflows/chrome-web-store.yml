name: Chrome Web Store Submit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to submit, for example v0.1.1
        required: true
      dry_run:
        description: Validate the release package and print the submission plan without uploading
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  # Deliberately a separate, environment-free job. GitHub evaluates `environment:` at the
  # job level, before any step runs, so a guard living inside the protected job cannot
  # report anything until a maintainer has already approved the deployment -- the refusal
  # would arrive after the human cost it exists to avoid, and an unapproved run would sit
  # waiting having never stated its reason.
  #
  # It must never carry `environment:`; `ci-workflow.test.ts` asserts that.
  enablement:
    name: Check upload enablement
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require explicit enablement for a real upload
        env:
          CWS_DRY_RUN: ${{ inputs.dry_run }}
          CWS_GUARD_STAGE: before approval
          CWS_SUBMIT_ENABLED: ${{ vars.CWS_SUBMIT_ENABLED }}
        run: node scripts/require-store-upload-enabled.mjs

  submit:
    name: Submit release package
    needs: enablement
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: chrome-web-store

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Download verified release package
        run: >-
          gh release download "${{ inputs.tag }}"
          --pattern "*chrome.zip"
          --pattern "*.sha256"
          --pattern "pack-release-provenance.v1.json"
          --dir .release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify downloaded release package
        run: >-
          node scripts/verify-github-release-assets.mjs
          --tag "${{ inputs.tag }}"
          --zip .release/*chrome.zip
          --checksum .release/*.sha256
          --provenance .release/pack-release-provenance.v1.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Re-checked at use time, not only at check time. The enablement job ran before this
      # job waited for approval, and that wait can last days -- one lasted 22 in this repo
      # (#336). Revoking the variable during the wait must revoke the upload, and nothing
      # else re-reads it.
      - name: Re-check enablement after approval
        env:
          CWS_DRY_RUN: ${{ inputs.dry_run }}
          CWS_GUARD_STAGE: after approval
          CWS_SUBMIT_ENABLED: ${{ vars.CWS_SUBMIT_ENABLED }}
        run: node scripts/require-store-upload-enabled.mjs

      - name: Submit to Chrome Web Store
        run: >-
          node scripts/publish-chrome-web-store.mjs
          --zip .release/*chrome.zip
          --provenance .release/pack-release-provenance.v1.json
          --dry-run "${{ inputs.dry_run }}"
        env:
          CWS_EXTENSION_ID: nfnbhekccajjfgkppolomflaeledoccb
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
