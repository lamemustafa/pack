name: Review findings gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    name: Review gate
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Resolve PR metadata
        id: resolve-pr
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ]; then
            echo "Could not determine pull request number." >&2
            exit 1
          fi

          head_ref="${EVENT_HEAD_REF}"
          base_ref="${EVENT_BASE_REF}"
          head_repo="${EVENT_HEAD_REPO}"
          head_sha="${EVENT_HEAD_SHA}"

          if [ -z "${head_ref}" ] || [ -z "${base_ref}" ] || [ -z "${head_repo}" ] || [ -z "${head_sha}" ]; then
            echo "Could not resolve complete pull request metadata for #${PR_NUMBER}." >&2
            exit 1
          fi

          {
            echo "pr=${PR_NUMBER}"
            echo "head_ref=${head_ref}"
            echo "base_ref=${base_ref}"
            echo "head_repo=${head_repo}"
            echo "head_sha=${head_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          repository: ${{ steps.resolve-pr.outputs.head_repo }}
          ref: ${{ steps.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Pack workflow preflight
        run: >-
          pnpm workflow:preflight -- --branch "${{ steps.resolve-pr.outputs.head_ref }}"
          --base-ref "${{ steps.resolve-pr.outputs.base_ref }}"
          --repo "${{ github.repository }}"
          --head-repo "${{ steps.resolve-pr.outputs.head_repo }}"

      - name: Check current-head review state
        run: >-
          pnpm review:gate -- --repo "${{ github.repository }}" --pr "${{ steps.resolve-pr.outputs.pr }}"
          --strict-head-review --required-review-author chatgpt-codex-connector
          --wait-head-review-ms 180000 --poll-interval-ms 10000 --allow-missing-head-review
          --expected-head-oid "${{ steps.resolve-pr.outputs.head_sha }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # The single context branch protection requires.
  #
  # `Review gate (scheduled)` was required alongside the PR-triggered gate, but it is published by a
  # cron workflow, and GitHub runs schedules best-effort: on this repository it fired roughly every
  # seven hours rather than the declared fifteen minutes. A required context that only a throttled
  # scheduler can publish makes every merge wait on that scheduler, so a green PR sits BLOCKED with
  # nothing wrong with it.
  #
  # Collapsing to one always-running context fixes that without lowering the bar: this job fails
  # whenever the gate it needs failed or was cancelled, and passes only when that gate succeeded or
  # was legitimately skipped. A gate that passed on *any* upstream result would be a false pass in
  # new clothes.
  #
  # Published only from here, deliberately. An earlier revision had the scheduled reconcile publish
  # this context too, to cover a thread resolved without a reply — which raises no pull_request event
  # and so cannot retrigger the job below. That reintroduced the very failure this job exists to
  # prevent: reconcile does not run the preflight or install steps, so a `review-gate` job that
  # failed for a non-review reason could still be overwritten with a passing `Required checks`.
  #
  # The gap it was covering is one the process already forbids. This workflow fires on
  # `pull_request_review_comment: created`, and a disposition must carry a reply — a partial reply is
  # not a disposition — so every legitimate close retriggers this job on its own.
  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs: [review-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify no required job failed
        shell: bash
        env:
          REVIEW_GATE_RESULT: ${{ needs.review-gate.result }}
        run: |
          set -euo pipefail
          echo "review-gate: ${REVIEW_GATE_RESULT}"
          case "${REVIEW_GATE_RESULT}" in
            success|skipped) ;;
            *)
              echo "Required job 'Review gate' reported '${REVIEW_GATE_RESULT}'." >&2
              exit 1
              ;;
          esac
