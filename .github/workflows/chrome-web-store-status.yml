name: Chrome Web Store Status

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected extension version. Defaults to package.json.
        required: false
        default: ""
      require_published:
        description: Fail unless the expected version is published.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  configuration:
    name: Detect Chrome Web Store status configuration
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: chrome-web-store-status
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}

    steps:
      - name: Detect status credentials
        id: credentials
        shell: bash
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$CWS_SERVICE_ACCOUNT_JSON" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome Web Store status check skipped because credentials are not configured. See #59."
            echo "### Chrome Web Store status check skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Credentials are not configured, so the read-only status check did not run. See #59." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

  status:
    name: Check Chrome Web Store status
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: chrome-web-store-status

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0

      - name: Check Chrome Web Store status
        run: node scripts/check-chrome-web-store-status.mjs
        env:
          CWS_EXTENSION_ID: nfnbhekccajjfgkppolomflaeledoccb
          CWS_EXPECTED_VERSION: ${{ inputs.expected_version }}
          CWS_REQUIRE_PUBLISHED: ${{ inputs.require_published || 'false' }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
