version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "triage"
    ignore:
      # `@types/node` majors track the Node major, and this repo's types are global:
      # tsconfig sets `types: ["chrome","node","vitest/globals"]`, so the declared Node
      # API surface applies across every file. Accepting a major ahead of the runtime
      # would let tsc approve APIs that do not exist at execution -- a failure that does
      # not appear at build time.
      #
      # This rule does not rely on being remembered.
      # `tests/repo/node-runtime-types-alignment.test.ts` fails when `engines.node` and
      # `@types/node` majors diverge, in either direction, so moving the runtime breaks
      # the suite until the types move with it and this entry is revisited.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

    groups:
      # Grouped by risk, not convenience. react, react-dom and @wxt-dev/module-react are
      # the only dependencies that reach a taxpayer's browser, so each runtime update still
      # arrives as its own PR with its own disposition. Everything below `react` is build-
      # or test-time and cannot ship.
      #
      # react and react-dom are the one exception, and it is not a relaxation of that rule.
      # React refuses to run when the two disagree -- "Incompatible React versions: the
      # react and react-dom packages must have the exact same version" -- so separate PRs
      # do not produce two independently reviewable updates. They produce one broken PR and
      # one that cannot be merged before it. #361 bumped react 19.2.8 without react-dom and
      # failed 25 suites for exactly this reason. Keeping them in one group preserves what
      # the ungrouped rule was for: this is still a runtime PR of its own, separate from
      # dev-tooling, reviewed and dispositioned on its own. @wxt-dev/module-react stays
      # ungrouped -- it carries no such constraint.
      #
      # This grouping does not rely on being remembered:
      # `tests/repo/react-runtime-version-parity.test.ts` fails whenever the resolved
      # react and react-dom versions diverge, however they came apart.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        dependency-type: "development"
        # Majors are excluded deliberately. A grouped PR is reviewed as one unit, and a
        # breaking change to vitest or wxt deserves its own diff, its own test run and its
        # own disposition rather than being carried along with six patch bumps.
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Action pins are CI-only and never packaged, but a major can change runner
      # behaviour under the release gates, so majors stay individual here too.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
