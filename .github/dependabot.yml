version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "triage"
    ignore:
      # `@types/node` majors track the Node major, and this repo's types are global:
      # tsconfig sets `types: ["chrome","node","vitest/globals"]`, so the declared Node
      # API surface applies across every file. CI pins node-version 24.20.0 and
      # `engines` requires >=24.20.0, so accepting @types/node 26 would let tsc approve
      # APIs that do not exist at runtime -- a failure that appears in production, not
      # at build time. Lift this when the runtime moves, and move both together.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

    groups:
      # Grouped by risk, not convenience. react, react-dom and @wxt-dev/module-react are
      # the only dependencies that reach a taxpayer's browser; they are deliberately not
      # grouped, so each runtime update still arrives as its own PR with its own
      # disposition. Everything below is build- or test-time and cannot ship.
      dev-tooling:
        dependency-type: "development"
        # Majors are excluded deliberately. A grouped PR is reviewed as one unit, and a
        # breaking change to vitest or wxt deserves its own diff, its own test run and its
        # own disposition rather than being carried along with six patch bumps.
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Action pins are CI-only and never packaged, but a major can change runner
      # behaviour under the release gates, so majors stay individual here too.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
